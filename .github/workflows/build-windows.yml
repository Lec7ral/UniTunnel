name: Build Windows Application (UniTunnel Wails v3)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  build-windows:
    name: Build UniTunnel for Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build React Frontend
        run: |
          npm ci --include=optional
          npm run build
          Write-Host "React frontend compiled to dist/ directory."

      - name: Download Wintun Driver DLL (x64)
        run: |
          New-Item -ItemType Directory -Force -Path dist-release
          Write-Host "Downloading official Wintun 0.14.1 release..."
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile "dist-release\wintun.zip"
          Expand-Archive -Path "dist-release\wintun.zip" -DestinationPath "dist-release\wintun_extracted" -Force
          Copy-Item -Path "dist-release\wintun_extracted\wintun\bin\amd64\wintun.dll" -Destination "dist-release\wintun.dll" -Force
          Remove-Item -Recurse -Force "dist-release\wintun_extracted", "dist-release\wintun.zip"
          Write-Host "Wintun.dll placed into release folder."

      - name: Download Tun2Socks L3 Engine (x64)
        run: |
          Write-Host "Downloading tun2socks L3 engine..."
          Invoke-WebRequest -Uri "https://github.com/xjasonlyu/tun2socks/releases/download/v2.5.2/tun2socks-windows-amd64.zip" -OutFile "dist-release\tun2socks.zip"
          Expand-Archive -Path "dist-release\tun2socks.zip" -DestinationPath "dist-release\tun2socks_extracted" -Force
          Copy-Item -Path "dist-release\tun2socks_extracted\tun2socks-windows-amd64.exe" -Destination "dist-release\tun2socks.exe" -Force
          Remove-Item -Recurse -Force "dist-release\tun2socks_extracted", "dist-release\tun2socks.zip"
          Write-Host "Tun2socks.exe placed into release folder."

      - name: Install Wails v3 CLI
        run: |
          Write-Host "Installing Wails v3 CLI..."
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Compile Windows Resource (Icon & UAC Manifest)
        working-directory: ./unitunnel-go
        run: |
          if (Get-Command windres -ErrorAction SilentlyContinue) {
            if (Test-Path "unitunnel.rc") {
              Write-Host "Compiling Windows resource object with windres..."
              windres -i unitunnel.rc -O coff -o rsrc_windows_amd64.syso
            }
          }

      - name: Build UniTunnel Go Executable (Wails v3)
        working-directory: ./unitunnel-go
        run: |
          $env:CGO_ENABLED="1"
          
          # Ensure dist directory is accessible for embed FS
          if (!(Test-Path "dist")) {
            Copy-Item -Recurse -Path "..\dist" -Destination "dist" -Force
          }
          
          go mod tidy
          
          Write-Host "Building Wails v3 executable..."
          go build -ldflags="-H windowsgui -s -w" -o ..\dist-release\unitunnel.exe .
          Write-Host "Build complete: dist-release\unitunnel.exe"

      - name: Prepare Windows Distribution Package
        run: |
          # Copy example config
          if (Test-Path "unitunnel-go\config.example.json") {
            Copy-Item -Path "unitunnel-go\config.example.json" -Destination "dist-release\config.json" -Force
          }
          
          # Copy icon if available
          if (Test-Path "unitunnel-go\icon.ico") {
            Copy-Item -Path "unitunnel-go\icon.ico" -Destination "dist-release\icon.ico" -Force
          }

          # Create UAC requireAdministrator manifest
          @"
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <assemblyIdentity version="1.0.0.0" processorArchitecture="*" name="UniTunnel" type="win32"/>
            <trustInfo xmlns="urn:schemas-microsoft-com:asm.v3">
              <security>
                <requestedPrivileges>
                  <requestedExecutionLevel level="requireAdministrator" uiAccess="false"/>
                </requestedPrivileges>
              </security>
            </trustInfo>
          </assembly>
          "@ | Out-File -FilePath "dist-release\unitunnel.exe.manifest" -Encoding utf8
          
          # Create Spanish instruction manual
          @"
          =======================================================
          UniTunnel (Wails v3) - Acceso Universitario para Windows
          =======================================================
          
          REQUISITOS:
          1. Ejecutar SIEMPRE 'unitunnel.exe' como Administrador (clic derecho -> Ejecutar como administrador).
             Es indispensable para que Windows permita inicializar el adaptador Wintun y las métricas de red.
          2. Mantener 'wintun.dll' y 'tun2socks.exe' en la misma carpeta que 'unitunnel.exe'.
          3. 'config.json' se crea o actualiza automáticamente con tus credenciales y servidor proxy (10.0.0.1:8080).
             ¡Ahora puedes editar absolutamente todos los ajustes directamente desde la ventana del programa!
          
          MODOS DE RED RÁPIDOS:
          - Cable UCI: Activa UniTunnel y asigna prioridad métrica 10 a la interfaz Ethernet.
          - Datos Móviles / Wi-Fi: Asigna prioridad métrica 10 a la interfaz Wi-Fi (y 100 a Ethernet),
            permitiendo navegar con el punto de acceso del teléfono SIN tener que desconectar el cable de red.
          - Directo: Restaura las métricas automáticas nativas de Windows.
          
          BANDEJA DEL SISTEMA:
          - UniTunnel cuenta con menú en la bandeja del sistema (al lado del reloj) para cambiar de modo
            de red con un solo clic, conectar/desconectar y consultar tu cuota de navegación.
          =======================================================
          "@ | Out-File -FilePath "dist-release\LEEME.txt" -Encoding utf8

      - name: Upload Build Artifacts (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: unitunnel-windows-wails3-x64
          path: dist-release/
          retention-days: 30
